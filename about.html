<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="درباره دبیرستان دوره اول استعدادهای درخشان شهید هاشمی نژاد ۲">
    <title>درباره ما | دبیرستان هاشمی نژاد ۲</title>
    <link rel="icon" href="/files/uploads/site/logo-footer.png">
    <script src="/assets/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/phosphor-icons/fill/style.css">
    <link rel="stylesheet" href="/assets/phosphor-icons/duotone/style.css">
    <script src="/assets/js/loading-orb.js" defer></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
        .header-logo { max-width: 140px; }
    </style>
</head>
<body class="text-gray-900 flex flex-col min-h-screen text-justify">
<div id="header"></div>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
    <div class="text-center mb-10">
        <h1 class="text-3xl font-extrabold text-gray-800">درباره ما</h1>
        <p class="text-gray-500 mt-2">معرفی دبیرستان دوره اول استعدادهای درخشان شهید هاشمی نژاد ۲</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border p-8 sm:p-12">
        <div id="about-intro" class="space-y-5 leading-9 text-gray-700">
            <div class="text-center py-10 text-gray-400"><hn-orb size="46" speed="750" motion="morph" class="text-green-600"></hn-orb></div>
        </div>

        <div class="flex justify-center my-10">
            <img src="/files/uploads/site/logo-school.png" alt="لوگوی مدرسه" class="w-60 rounded-xl shadow-md">
        </div>

        <!-- امکانات مدرسه -->
        <h2 class="text-2xl font-extrabold text-gray-800 mb-5">امکانات مدرسه</h2>
        <div id="facilities-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-12"></div>

        <h2 class="text-2xl font-extrabold text-gray-800 mb-5">سوالات متداول</h2>
        <div id="faq-list" class="space-y-3"></div>
    </div>
</main>

<div id="footer"></div>
<script src="/header.js"></script>
<script src="/footer.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/admin-bar.js"></script>
<script src="/breadcrumb.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const s = await (await fetch('/files/api/settings.php?action=public')).json();
        if (s.success && s.data.about_intro?.length) {
            document.getElementById('about-intro').innerHTML = s.data.about_intro.map(p => `<p>${esc(p).replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>')}</p>`).join('');
        }
        const fac = await (await fetch('/files/api/content.php?action=get_facilities')).json();
        document.getElementById('facilities-grid').innerHTML = fac.data.map(f => `
            <div class="bg-gray-50 rounded-xl border p-5 text-center hover:border-green-500 transition" data-fac-id="${f.id}">
                <i class="ph-duotone ${esc(f.icon)} text-4xl text-green-600 mb-2"></i>
                <h3 class="font-bold text-gray-800 text-sm">${esc(f.title)}</h3>
            </div>`).join('');
        const faq = await (await fetch('/files/api/content.php?action=get_faq')).json();
        document.getElementById('faq-list').innerHTML = faq.data.map(f => `
            <div data-accordion data-faq-id="${f.id}" class="bg-gray-50 rounded-xl border overflow-hidden">
                <button data-q class="w-full flex justify-between items-center px-5 py-4 font-bold text-gray-800 hover:bg-white transition text-right">
                    <span>${esc(f.q)}</span>
                    <i class="ph-bold ph-caret-down text-gray-400 transition-transform"></i>
                </button>
                <div data-a class="hidden px-5 pb-4 text-gray-600 leading-7">${esc(f.a)}</div>
            </div>`).join('');
        bindAccordion();
    } catch (e) {}
});
</script>
</body>
</html>
