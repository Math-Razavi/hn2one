<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ارتباط با دبیرستان هاشمی نژاد ۲ — تلفن، ایمیل، آدرس و ارسال پیام">
    <title>ارتباط با ما | دبیرستان هاشمی نژاد ۲</title>
    <link rel="icon" href="/files/uploads/site/logo-footer.png">
    <script src="/assets/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/phosphor-icons/fill/style.css">
    <link rel="stylesheet" href="/assets/phosphor-icons/duotone/style.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
        .header-logo { max-width: 140px; }
    </style>
</head>
<body class="text-gray-900 flex flex-col min-h-screen">
<div id="header"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
    <div class="text-center mb-10">
        <h1 class="text-3xl font-extrabold text-gray-800">اینجا برای ارتباط با ماست...</h1>
        <p class="text-gray-500 mt-2">هرگونه سوال، انتقاد و پیشنهاد خود را برای ما ارسال کنید.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- اطلاعات تماس -->
        <div id="contact-cards" class="space-y-4">
            <div class="bg-white rounded-2xl border p-6 flex items-center gap-4 shadow-sm">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0"><i class="ph-fill ph-phone text-2xl text-green-600"></i></div>
                <div><p class="text-sm text-gray-500">تلفن</p><p class="font-bold text-gray-800" id="c-phones">...</p></div>
            </div>
            <div class="bg-white rounded-2xl border p-6 flex items-center gap-4 shadow-sm">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0"><i class="ph-fill ph-envelope text-2xl text-green-600"></i></div>
                <div><p class="text-sm text-gray-500">ایمیل</p><p class="font-bold text-gray-800" id="c-email" dir="ltr">...</p></div>
            </div>
            <div class="bg-white rounded-2xl border p-6 flex items-center gap-4 shadow-sm">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0"><i class="ph-fill ph-map-pin text-2xl text-green-600"></i></div>
                <div><p class="text-sm text-gray-500">آدرس</p><p class="font-bold text-gray-800" id="c-address">...</p></div>
            </div>
            <div class="flex gap-3">
                <a id="c-eitaa" href="#" target="_blank" rel="noopener" class="flex-1 bg-yellow-400 hover:bg-yellow-500 transition text-gray-900 rounded-2xl p-4 text-center font-bold shadow-sm">پیام‌رسان ایتا</a>
                <a id="c-shad" href="#" target="_blank" rel="noopener" class="flex-1 bg-yellow-400 hover:bg-yellow-500 transition text-gray-900 rounded-2xl p-4 text-center font-bold shadow-sm">شاد</a>
            </div>
        </div>

        <!-- فرم پیام -->
        <div class="lg:col-span-2 bg-white rounded-2xl border shadow-sm p-8">
            <h2 class="text-xl font-extrabold text-gray-800 mb-2">راه ارتباطی با مدرسه</h2>
            <p class="text-sm text-gray-500 mb-6">اولیا و دانش‌آموزان محترم! لطفاً فرم زیر را تکمیل کنید؛ پیام شما در پنل مدرسه ثبت خواهد شد.</p>
            <form id="msg-form" class="space-y-4">
                <div>
                    <label for="m-name" class="block mb-1 font-semibold text-sm">نام و نام خانوادگی *</label>
                    <input id="m-name" name="name" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label for="m-phone" class="block mb-1 font-semibold text-sm">تلفن همراه (جهت پیگیری پیام)</label>
                    <input id="m-phone" name="phone" inputmode="tel" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label for="m-text" class="block mb-1 font-semibold text-sm">متن پیام *</label>
                    <textarea id="m-text" name="message" rows="5" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"></textarea>
                </div>
                <div id="msg-box" class="h-6 text-center font-bold text-sm"></div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg text-lg font-bold hover:bg-green-700 transition shadow-md">ارسال پیام</button>
            </form>
        </div>
    </div>
</main>

<div id="footer"></div>
<script src="/header.js"></script>
<script src="/footer.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/breadcrumb.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const s = await (await fetch('/files/api/settings.php?action=public')).json();
        if (s.success) {
            document.getElementById('c-phones').textContent = s.data.phones;
            document.getElementById('c-email').textContent = s.data.email;
            document.getElementById('c-address').textContent = s.data.address;
            document.getElementById('c-eitaa').href = s.data.eitaa || '#';
            document.getElementById('c-shad').href = s.data.shad || '#';
        }
    } catch (e) {}

    document.getElementById('msg-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const box = document.getElementById('msg-box');
        box.textContent = 'در حال ارسال...';
        box.className = 'h-6 text-center font-bold text-sm text-gray-500';
        const fd = new FormData();
        fd.append('action', 'submit_message');
        fd.append('name', document.getElementById('m-name').value);
        fd.append('phone', document.getElementById('m-phone').value);
        fd.append('message', document.getElementById('m-text').value);
        try {
            const r = await (await fetch('/files/api/content.php', { method: 'POST', body: fd })).json();
            box.textContent = r.message;
            box.className = 'h-6 text-center font-bold text-sm ' + (r.success ? 'text-green-600' : 'text-red-600');
            if (r.success) e.target.reset();
        } catch (err) {
            box.textContent = 'خطا در ارسال پیام.';
            box.className = 'h-6 text-center font-bold text-sm text-red-600';
        }
    });
});
</script>
</body>
</html>
